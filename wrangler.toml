# Cloudflare Workers deployment — no ChatGPT account or Sites panel needed.
# One-time setup: create the D1 database and the KV namespace (see DEPLOY-CLOUDFLARE.md)
# and paste both ids below. Every secret is pushed as a Worker secret by
# .github/workflows/deploy.yml from GitHub repository secrets, so nothing secret
# ever lives in this file.
name = "mezon-aroos"
main = "worker/index.js"
compatibility_date = "2026-10-01"

[observability]
enabled = true

[[d1_databases]]
binding = "DB"
database_name = "mezon-aroos"
database_id = "e40fa80a-e0bd-47a8-8892-ac1a5f77e649"
migrations_dir = "drizzle"

# Photo storage. Workers KV is on the free plan and needs no payment method.
[[kv_namespaces]]
binding = "KV"
id = "f51380d2dab2445b9be27dc00ab30992"

# Optional: R2 needs a payment method on the account. If you enable R2 billing later,
# uncomment this block, delete the KV block and keep bucket name "mezon-aroos-media".
# [[r2_buckets]]
# binding = "BUCKET"
# bucket_name = "mezon-aroos-media"

# Telegram delivery retries and retention cleanup run automatically; no GitHub cron needed.
# The account is at the Workers Free limit of 5 cron triggers, so none is set here.
# Re-add `[triggers] crons = ["*/10 * * * *"]` once a cron slot is free (or on Workers Paid).

# Catalog style photos (public/catalog/NN.webp) are served as static files before the worker.
# The custom domain mezon-aroos.omidfreelanc.workers.dev is attached in the Cloudflare dashboard
# (Workers & Pages > mezon-aroos > Settings > Domains & Routes), because the deploy token cannot edit zone routes.

# Temporary: no image limits for anyone (per-person quota, daily cap, per-network cap, trial and credit counters).
# Remove this line (or set it to "0") to bring every limit back.
[vars]
LIMITS_OFF = "1"
# Temporary: force the Pro image model for every salon (remove this line to follow each salon's own setting).
IMAGE_MODEL = "pro"

[assets]
directory = "./public"
